services:
  postgres:
    image: postgres:16
    container_name: linkpendek-postgres
    environment:
      POSTGRES_DB: linkpendek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - linkpendek-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkpendek"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linkpendek-redis
    ports:
      - "6379:6379"
    volumes:
      - linkpendek-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  linkpendek-postgres-data:
  linkpendek-redis-data: